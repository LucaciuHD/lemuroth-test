<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemuroth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0F13;--panel:#151920;--panel2:#1B2029;--line:#2B313C;--line2:#3A414D;--gold:#D4AF6A;--gold-dk:#17130B;--text:#ECE6D8;--soft:#C9C2B3;--muted:#A3ACBA;--dim:#8A92A0;--green:#9FCB9E;--warm:#E7C77F;--sel:#221D14;--red:#E08A7A;
--frame-line:#8C6A2E;--line-map:#39404C;--map-bg:#14110D;--map-dim0:rgba(8,9,12,0);--map-dim1:rgba(8,9,12,.18);--map-dim2:rgba(8,9,12,.5);--region:#C9A86A;--region-red:#D2A49B;--mk-line:#4A4232;--city-line:#6A2E28;--city-text:#E0BCB5;--heart-line:#8E3A33;--heart-text:#EBC2BA;--heart-bg:#3A1714;
--line-soft:#222832;--frame-line-dk:#3A2C1B;--player-blue:#7FB3E0;--player-text:#C9D3E0;--player-hi:#9CC3E6;
--p-bg:#16130E;--p-cliff:#0F0D0A;--p-river:#15212A;--p-cave:#060504;--p-edge:#3A3020;--p-street:#221C14;--p-quarter:#1C1812;--p-house:#241E15;--p-building:#2A2319;--p-bstroke:#4A3C28;--p-stall:#2A2218;--p-stallstroke:#5A4830;--p-tp:#2F7FCF;
--w-sky:#1c2433;--w-ground:#3a3128;--w-slabEdge:#2a231b;--w-slab:#4a3f31;--w-street:#5e523f;--w-stone:#7c6c57;--w-stone2:#6a5c49;--w-roof:#4b3726;--w-tower:#857560;--w-wood:#5a4330;--w-cliff:#3b342c;--w-cliff2:#2f2922;--w-cave:#070605;--w-river:#264a5c;--w-gold:#d4af6a;--w-lamp:#ffb54a;--w-lampGlow:#ffa53a;--w-lampPost:#2a2218;--w-hero:#7d8f4e;--w-warden:#5c6b82;--w-skin:#c9a98a;--w-friend:#6f9e6e;--w-player:#5f82a8;--w-canopy1:#7a3b2e;--w-canopy2:#8a6a2a;--w-canopy3:#2f5d5a;--w-canopy4:#5a3f6a;--w-soon:#4a4232;--w-tpStone:#6f6454;--w-tpDisc:#2f7fcf;--w-tpCore:#9fd4ff;--w-tpCrystal:#7cc4ff;
--f-title:Cinzel,Georgia,"Times New Roman",serif;--f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.4;font-variant-numeric:lining-nums tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{cursor:default}
a{color:var(--gold);text-decoration:none}a:hover{color:#ECD39C}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{min-height:100vh;display:flex;flex-direction:column}
.fund{position:fixed;inset:0;background:center/cover no-repeat;filter:brightness(.45);z-index:-1}

/* top bar */
.top{height:64px;flex-shrink:0;display:flex;align-items:center;gap:32px;padding:0 40px;border-bottom:1px solid var(--line);background:var(--bg)}
.top.s{justify-content:space-between}
.brand{font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:3px;color:var(--gold)}
.ttl{font-family:var(--f-title);font-weight:600;font-size:18px;letter-spacing:2px}
.who{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:14px;color:var(--muted)}
.who b{color:var(--warm);font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:#2A2418;border:1px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-title);font-weight:700;font-size:13px;color:var(--gold)}
.lnk{color:var(--gold);font-size:14px}

/* pieces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cap{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--muted)}
.hr{height:1px;background:var(--line);flex-shrink:0}
.row{display:flex;justify-content:space-between;gap:12px}
.row>span:first-child{color:var(--muted)}
.big{display:flex;align-items:center;justify-content:center;height:56px;border-radius:8px;background:var(--gold);color:var(--gold-dk);font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:3px;width:100%;text-align:center}
.big.xl{height:64px;font-size:22px}
.big:hover:not(:disabled){background:#E0BC7C}
.big:disabled{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.ghost{display:flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line2);font-size:14px;color:var(--soft)}
.ghost:hover:not(:disabled){border-color:var(--gold);color:var(--text)}
.ghost:disabled{color:var(--dim);border-color:var(--line)}
.tag{font-size:12px;font-weight:700;color:var(--gold-dk);background:var(--gold);border-radius:4px;padding:3px 8px;white-space:nowrap}
.tag.o{background:transparent;color:var(--warm);border:1px solid #8C6A2E}
.muted{color:var(--muted)}.soft{color:var(--soft)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.xp{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.xp i{display:block;height:100%;background:var(--gold)}

/* sign in */
.si{margin:auto;width:520px;max-width:92vw;display:flex;flex-direction:column;align-items:center;gap:28px;padding-bottom:40px}
.si h1{margin:0;font-family:var(--f-title);font-weight:700;font-size:64px;letter-spacing:6px;color:var(--gold);line-height:1;text-align:center}
.si .card{width:100%;padding:28px;gap:20px;border-color:#3A3426}
.foot{display:flex;justify-content:space-between;gap:20px;padding:0 40px 28px;font-size:13px;color:var(--muted)}

/* heroes */
.heroes{flex:1;display:grid;grid-template-columns:340px minmax(0,1fr) 360px;gap:24px;padding:24px 40px;min-height:0}
.hrow{display:flex;align-items:center;gap:14px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);width:100%}
.hrow.on{background:var(--sel);border-color:var(--gold)}
.hrow img{width:56px;height:56px;border-radius:6px;object-fit:cover;object-position:center 12%;flex-shrink:0}
.hrow .n{font-size:17px;font-weight:700}
.hrow .m{font-size:13px;color:var(--soft)}.hrow .m2{font-size:13px;color:var(--muted)}
.hrow.new{border-style:dashed;border-color:var(--line2);background:none}
.hrow.new .plus{width:56px;height:56px;border-radius:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:28px}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0C1018;min-height:440px}
.stage img.p{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center 20%}
.chip{position:absolute;top:16px;left:16px;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.plate{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:center}
.plate>div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 24px;text-align:center}
.plate .nm{font-family:var(--f-title);font-weight:700;font-size:26px;letter-spacing:2px}
.races9{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.races9 img{width:100%;aspect-ratio:2/3;object-fit:cover;object-position:center 15%;border-radius:4px;display:block}
.races9 img.on{outline:1px solid var(--gold)}

/* create */
.cr{flex:1;display:flex;flex-direction:column;gap:22px;padding:24px 40px;min-height:0}
.race9{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:12px}
.rc{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.rc:hover{border-color:var(--line2)}
.rc.on{border:2px solid var(--gold)}
.rc img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.rc b{font-size:15px;font-weight:700;padding:8px 10px 0}
.rc small{font-size:12px;color:var(--muted);padding:2px 10px 10px}
.det{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr) 360px;gap:24px;min-height:0}
.det .pic{border-radius:10px;overflow:hidden;border:1px solid var(--gold);background:#0C1018}
.det .pic img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block}
.det h2{margin:0;font-family:var(--f-title);font-weight:700;font-size:30px;letter-spacing:2px}
.det p{margin:0;font-size:16px;line-height:1.55;color:var(--soft);max-width:60ch}
.gridkv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.field{height:52px;width:100%;border-radius:8px;background:var(--bg);border:1px solid var(--line2);padding:0 14px;font:inherit;font-size:18px;color:var(--text)}
.field:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.err{font-size:13px;color:var(--red);min-height:19px}

/* hideout */
.hide{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding:20px 40px 24px}
.hl{display:flex;flex-direction:column;gap:14px;min-width:0}
.scene{position:relative;border-radius:12px;overflow:hidden;border:1px solid #3A2C1B;aspect-ratio:16/9;flex-shrink:0;background:#0C1018}
.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sttl{position:absolute;top:12px;left:12px;font-family:var(--f-title);font-weight:700;font-size:16px;letter-spacing:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.cust{position:absolute;top:12px;right:12px;font-size:13px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;color:var(--muted)}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border-radius:999px;background:var(--bg);border:1px solid #8C6A2E;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap}
.pin i{width:8px;height:8px;border-radius:50%;background:var(--warm);display:block}
.pin span{font-weight:400;color:var(--muted)}
.pin.on{border-color:var(--gold);box-shadow:0 0 0 2px #D4AF6A33}
.pin.free{border-style:dashed;border-color:var(--line2);cursor:default}
.menu{flex:1;border:1px dashed var(--line2);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.menu b{font-family:var(--f-title);font-size:20px;letter-spacing:1px}
.sts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.st{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.st:hover{border-color:var(--line2)}
.st.on{border:2px solid var(--gold)}
.st img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.st b{font-size:13px;font-weight:700;padding:8px 10px 0}
.st small{font-size:12px;color:var(--muted);padding:2px 10px 9px}
.hr2{display:flex;flex-direction:column;gap:14px;min-width:0}
.soon{padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px dashed var(--line2);font-size:14px;color:var(--soft)}



/* misc */
.modal{position:fixed;inset:0;background:#0D0F13d9;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal .card{width:460px;max-width:100%;border-color:#3A3426;padding:26px;gap:16px}
.modal h3{margin:0;font-family:var(--f-title);font-size:22px;letter-spacing:1px}
.btns{display:flex;gap:10px}.btns>*{flex:1}
@media (max-width:1380px){.top{gap:20px;padding:0 24px}.heroes,.cr,.hide{padding-left:24px;padding-right:24px;gap:18px}.hide{padding-top:14px;padding-bottom:14px}.hl{gap:10px}.heroes{grid-template-columns:300px minmax(0,1fr) 320px}.hide{grid-template-columns:minmax(0,1fr) 340px}.det{grid-template-columns:200px minmax(0,1fr) 320px;gap:18px}.race9{gap:8px}.sts{gap:8px}.foot{padding:0 24px 24px}.who{gap:14px}}
/* Town and map screens (J003). Same variables as style.css; no colours or fonts of their own. */
.top.tt{gap:24px}
.tw{display:flex;align-items:center;gap:10px}
.tw img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:center 8%;border:1px solid var(--gold)}
.tw b{display:block;font-size:15px;font-weight:700}.tw small{display:block;font-size:12px;color:var(--muted)}
.top nav{display:flex;gap:4px;height:100%;margin-left:12px}
.top nav button,.top nav span{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent}
.top nav button.on{font-weight:700;color:var(--text);border-bottom-color:var(--gold)}
.top nav span.lk,.top nav span.dim{color:var(--dim)}.top nav small{font-size:12px}
.tmain{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr);overflow:hidden;gap:16px;padding:16px 24px 18px;min-height:0;height:calc(100vh - 64px)}
.t3d{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--frame-line-dk);background:var(--p-bg);min-width:0;min-height:0}
.t3d-canvas,.t3d-canvas canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.t3d-canvas canvas:active{cursor:grabbing}
.t3d-labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.lbl.place{pointer-events:auto;cursor:pointer;background:var(--bg);border:1px solid var(--frame-line);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--text);display:flex;flex-direction:column;align-items:center}
.lbl.place small{font-weight:400;color:var(--muted);font-size:11px}
.lbl.place.later{border-style:dashed;border-color:var(--mk-line);color:var(--muted)}
.lbl.quarter{background:var(--bg);border-radius:6px;padding:4px 10px;font-family:var(--f-title);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--region)}
.lbl.pl{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--player-hi)}
.lbl.pl.friend{color:var(--green)}
.lbl.me{background:var(--bg);border:2px solid var(--gold);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;color:var(--warm)}
.t3derr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:340px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.tover{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--frame-line);border-radius:10px;padding:8px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.tover b{font-size:16px}.tover span{font-size:13px;color:var(--muted)}
.tview{position:absolute;top:12px;right:12px;background:var(--bg);border:1px solid var(--frame-line);border-radius:8px;min-height:40px;padding:0 14px;font-size:14px;font-weight:700;color:var(--warm);z-index:3}
.thelp{position:absolute;left:12px;bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.thelp kbd{font-family:var(--f-body);font-weight:700;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:2px}
.tpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--frame-line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;z-index:5}
.tpanel[hidden],.tplan[hidden],.tover[hidden]{display:none}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ptitle2{font-family:var(--f-title);font-weight:700;font-size:22px;color:var(--warm);letter-spacing:.03em}.psub{font-size:13px;color:var(--muted)}
.ptext{font-size:15px;line-height:1.5;color:var(--soft)}
.fr2{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--line-soft)}.fr2 span:first-child{color:var(--muted)}
.btns2{display:flex;gap:8px}
.b2{display:flex;align-items:center;justify-content:center;flex:1;height:44px;border-radius:8px;border:1px solid var(--frame-line);font-size:14px;font-weight:700;color:var(--warm);text-align:center}
.b2:hover:not(:disabled){background:var(--sel)}.b2:disabled{color:var(--dim);border-color:var(--line)}
.b2.wide{flex:none;width:100%}
.tplan{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:4}
.planbox{position:relative;border:1px solid var(--frame-line-dk);border-radius:10px;background:var(--p-bg)}
.pq{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-title);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--region);white-space:nowrap;pointer-events:none}
.ppin{position:absolute;transform:translate(-50%,-50%);background:var(--bg);border:1px solid var(--frame-line);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--text);white-space:nowrap}
.ppin.later{border-style:dashed;border-color:var(--mk-line);color:var(--muted)}.ppin b{font-weight:700;display:block}.ppin i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.pdot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:11px;color:var(--player-text);white-space:nowrap;pointer-events:none}
.pdot i{width:7px;height:7px;border-radius:50%;background:var(--player-blue);display:block}.pdot.fr i{background:var(--green)}
.pme{position:absolute;transform:translate(-50%,-50%);padding:3px 10px;border-radius:999px;background:var(--bg);border:2px solid var(--gold);font-size:12px;font-weight:700;color:var(--warm);pointer-events:none}
.phint{position:absolute;bottom:8px;right:10px;font-size:12px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:6px}
.tside{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding-right:2px}
.tp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.tt2{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.tt2 span{letter-spacing:0;font-weight:400}
.hint{font-size:12px;color:var(--muted);line-height:1.4}.small{font-size:13px;color:var(--muted)}.gd{color:var(--warm)}.fr{color:var(--green)}
.q{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)}.q:first-child{border-top:0;padding-top:0}
.q>div{display:flex;flex-direction:column;gap:2px;flex:1}.qt{font-size:14px;font-weight:700}.qs{font-size:12px;color:var(--muted)}.qr{font-size:13px;color:var(--warm)}.dim{color:var(--dim)}
.lnk.sm{font-size:14px;align-self:flex-start;padding:0}
.tchat{flex:1;min-height:150px}
.tabs2{display:flex;align-items:baseline;gap:14px;font-size:13px;color:var(--muted)}.tabs2 .on{font-weight:700;color:var(--text);border-bottom:2px solid var(--gold)}
.chatlog{flex:1;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.45;color:var(--soft)}
.cl .pn{color:var(--player-blue)}.cl .me{color:var(--warm)}
.chatin{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.chatin:focus{outline:2px solid var(--gold);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--frame-line);border-radius:8px;padding:10px 18px;font-size:14px;color:var(--warm);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.mapview{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--frame-line);background:var(--map-bg);min-width:0;min-height:0;cursor:grab;touch-action:none}
.mapview.drag{cursor:grabbing}
.mapworld{position:absolute;left:0;top:0;transform-origin:0 0;--ls:1}
.mimg{position:absolute;top:0;max-width:none;user-select:none;pointer-events:none}
.mdim,.mroad{position:absolute;left:0;top:0;pointer-events:none}
.mroad .rs{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round}
.mroad .rt{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round}
.mroad .rp{fill:none;stroke:var(--gold);stroke-width:2}.mroad .rd{fill:var(--gold)}
.lab{transform:translate(-50%,-50%) scale(var(--ls))}
.mapworld[data-hide~="zones"] [data-f="zones"],.mapworld[data-hide~="forts"] [data-f="forts"],.mapworld[data-hide~="cities"] [data-f="cities"]{display:none}
.rg{position:absolute;padding:5px 14px;border-radius:6px;background:var(--bg);font-family:var(--f-title);font-weight:700;font-size:14px;letter-spacing:.18em;color:var(--region);white-space:nowrap;pointer-events:none}
.rg.red{color:var(--region-red)}
.zn{position:absolute;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line-map);color:var(--dim);white-space:nowrap}
.zn .lv{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel2);border-radius:5px;padding:1px 6px}
.zn b{font-size:13px;font-weight:700;color:var(--muted)}.zn svg{flex-shrink:0}
.zn.lg b{font-family:var(--f-title);font-size:14px;letter-spacing:.03em}
.zn.open{border:2px solid var(--gold)}.zn.open b{color:var(--warm)}.zn.open .lv{background:var(--gold);color:var(--gold-dk)}
.zn.next{border:1px dashed var(--gold)}.zn.next b{color:var(--text)}
.zn.heart{border:2px solid var(--heart-line)}.zn.heart b{color:var(--heart-text);font-size:16px}.zn.heart .lv{background:var(--heart-bg);color:var(--heart-text)}
.zn.sel{outline:2px solid var(--gold);outline-offset:5px}
.zn:hover{border-color:var(--gold)}
.mk{position:absolute;display:flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--mk-line);font-size:12px;color:var(--soft);white-space:nowrap;pointer-events:none}
.mk svg{color:var(--region)}
.mk.city{border-color:var(--city-line);color:var(--city-text)}.mk.city svg{color:var(--city-text)}
.mtown{position:absolute;display:flex;flex-direction:column;align-items:center;padding:8px 18px;border-radius:8px;background:var(--gold);color:var(--gold-dk);white-space:nowrap;text-align:center}
.mtown b{font-family:var(--f-title);font-size:16px;letter-spacing:.04em}.mtown span{font-size:12px}
.manother{position:absolute;display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:8px;border:1px dashed var(--mk-line);background:var(--bg);white-space:nowrap;pointer-events:none}
.manother b{font-size:13px;color:var(--soft)}.manother span{font-size:11px;color:var(--muted)}
.mframe{position:absolute;inset:10px;border:1px solid var(--frame-line);border-radius:6px;pointer-events:none}
.mcorner{position:absolute;width:34px;height:34px;color:var(--gold);pointer-events:none}
.mcorner.c0{left:4px;top:4px}.mcorner.c90{right:4px;top:4px}.mcorner.c180{right:4px;bottom:4px}.mcorner.c270{left:4px;bottom:4px}
.mplate{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 24px;border-radius:8px;background:var(--bg);border:1px solid var(--frame-line);pointer-events:none;max-width:calc(100% - 200px);text-align:center}
.mplate span{font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--warm)}.mplate small{font-size:13px;color:var(--muted)}
.mtools{position:absolute;top:26px;left:26px;display:flex;flex-direction:column;gap:8px}
.tool{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:var(--bg);border:1px solid var(--line-map);color:var(--text);font-size:22px;line-height:1}
.tool:hover{border-color:var(--gold)}.tool svg{color:var(--gold)}
.mchips{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.mchip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line-map);font-size:13px;color:var(--soft);white-space:nowrap}
.mchip.on{border-color:var(--gold);color:var(--text)}.mchip.off{color:var(--dim);border-style:dashed}
.mnote{position:absolute;bottom:28px;right:28px;padding:5px 10px;border-radius:6px;background:var(--bg);font-size:12px;color:var(--muted);pointer-events:none}
.zpic{height:120px;border-radius:8px;border:1px solid var(--frame-line);background-repeat:no-repeat;background-size:1344px 752px;background-color:var(--map-bg)}
.zname{font-family:var(--f-title);font-weight:700;font-size:22px;color:var(--warm);letter-spacing:.03em}
.rws .rw{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}.rws .rw:first-child{border-top:0}.rw span:first-child{color:var(--muted)}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.sw{width:22px;height:14px;border-radius:4px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}.sw.o{border:2px solid var(--gold)}.sw.n{border:1px dashed var(--gold)}.sw.l{border:1px solid var(--line-map)}
.prog{height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
@media (max-height:1000px){.tside .hint:not(.key){display:none}}
@media (max-width:1380px){.tmain{grid-template-columns:minmax(0,1fr) 300px;padding:12px 16px}.top.tt{gap:14px}.top nav button,.top nav span{padding:0 10px}}

.chatin::placeholder,.field::placeholder{color:var(--muted);opacity:1}

/* the town plan (M): shapes take their colours from the --p-* variables */
.planbox svg{display:block;border-radius:10px}
.p-bg{fill:var(--p-bg)}.p-cliff{fill:var(--p-cliff)}.p-river{fill:var(--p-river)}.p-cave{fill:var(--p-cave);stroke:var(--p-edge)}
.p-street{stroke:var(--p-street)}.p-quarter{fill:var(--p-quarter);stroke:var(--p-edge);stroke-width:2}
.p-house{fill:var(--p-house)}.p-building{fill:var(--p-building);stroke:var(--p-bstroke)}
.p-stall{fill:var(--p-stall);stroke:var(--p-stallstroke)}.p-wall{fill:var(--frame-line)}
.p-tp-ring{fill:var(--p-quarter);stroke:var(--gold);stroke-width:5}.p-tp-core{fill:var(--p-tp)}
.ppin{z-index:2}.pme{z-index:3}

/* the first steps (J005): the intro, the Warden, the quest tracker and the way marks. Colours and fonts come from the variables in style.css. */
.intro{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:hidden;cursor:pointer}
.ipic{position:absolute;inset:0;background-repeat:no-repeat;animation:iin .5s ease-out,izoom var(--auto) linear forwards}
.ivig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,color-mix(in srgb,var(--bg) 78%,transparent) 100%),linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent) 0,transparent 22%,transparent 62%,color-mix(in srgb,var(--bg) 70%,transparent) 100%)}
.ihero{position:absolute;right:40px;bottom:48px;width:210px;height:270px;object-fit:cover;object-position:center 10%;border-radius:12px;border:1px solid var(--gold)}
.ibrand{position:absolute;left:40px;top:28px;font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:3px;color:var(--gold)}
.iskip{position:absolute;right:40px;top:22px;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);font-size:14px;font-weight:700;color:var(--text)}
.iskip:hover{border-color:var(--gold)}
.intro kbd{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:1px 7px}
.iplate{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);width:min(860px,calc(100% - 48px));background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:22px 34px 20px;display:flex;flex-direction:column;gap:12px}
.irow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ititle{font-family:var(--f-title);font-weight:700;font-size:26px;letter-spacing:.12em;color:var(--warm)}
.icount{font-size:13px;color:var(--muted)}
.iplate p{margin:0;font-size:21px;line-height:1.55;color:var(--text)}
.ibars{display:flex;gap:6px}.ibars i{display:block;width:44px;height:3px;border-radius:2px;background:var(--line2)}.ibars i.done,.ibars i.now{background:var(--gold)}
.icont{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
@keyframes iin{from{opacity:0}to{opacity:1}}
@keyframes izoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.ipic{animation:none}}

.trk{position:absolute;left:16px;top:16px;width:322px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 18px 12px;display:flex;flex-direction:column;gap:9px;z-index:2}
.trk[hidden],.dlg[hidden]{display:none}
.tk-act{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.tk-title{font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--warm)}
.trk .ts{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text)}
.trk .ts.ok span:last-child{color:var(--muted);text-decoration:line-through}
.trk .ts.dim{color:var(--muted)}
.ck{width:16px;height:16px;border-radius:4px;border:1px solid var(--dim);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ck.ok{background:var(--gold);border-color:var(--gold);color:var(--gold-dk)}
.tk-next{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:2px}

.dlg{position:absolute;left:28px;right:28px;bottom:20px;z-index:4;background:var(--bg);border:1px solid var(--frame-line);border-radius:12px;padding:20px 24px;display:flex;gap:22px}
.t3d.talking .thelp,.t3d.talking .tover{display:none}
.dport{position:relative;width:112px;height:112px;flex-shrink:0;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);overflow:hidden}
.dport .db{position:absolute;left:50%;bottom:-8px;width:62px;height:70px;transform:translateX(-50%);border-radius:30px 30px 0 0;background:var(--w-warden)}
.dport .dh{position:absolute;left:50%;top:26px;width:34px;height:34px;transform:translateX(-50%);border-radius:50%;background:var(--w-skin,#C8A882);z-index:1;box-shadow:0 -4px 0 -1px var(--gold)}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dname{font-family:var(--f-title);font-weight:700;font-size:18px;letter-spacing:.12em;color:var(--warm)}
.drole{font-size:13px;color:var(--player-blue);margin-left:12px}
.dact{font-size:13px;color:var(--muted)}
.dbody p{margin:0;font-size:17px;line-height:1.55;color:var(--text)}
.dbtns{display:flex;align-items:center;gap:12px;margin-top:2px}
.dacc,.dalt{display:flex;align-items:center;gap:10px;height:42px;padding:0 20px;border-radius:8px;font-size:15px}
.dacc{background:var(--gold);color:var(--gold-dk);font-weight:700}.dacc:hover{background:var(--warm)}
.dacc kbd{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--gold-dk);border:1px solid var(--frame-line);border-radius:4px;padding:0 6px;background:var(--warm)}
.dalt{border:1px solid var(--line2);color:var(--soft)}.dalt:hover{border-color:var(--gold);color:var(--text)}
.drew{margin-left:auto;font-size:13px;color:var(--muted)}.drew b{font-weight:400;color:var(--warm)}

.lbl.npc{background:var(--bg);border:1px solid var(--gold);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--warm)}
.lbl.mark{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--dim);color:var(--bg)}
.lbl.mark.give{background:var(--gold);color:var(--gold-dk)}
.t3d-marks{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.wp{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--gold);white-space:nowrap;will-change:transform}
.wp b{font-size:13px;font-weight:700;color:var(--text)}.wp span{font-size:12px;color:var(--muted)}
.wp .dia{width:10px;height:10px;background:var(--gold);transform:rotate(45deg);flex-shrink:0}
.wp .wpa{display:none;color:var(--warm);flex-shrink:0}
.wp.edge .dia{display:none}.wp.edge .wpa{display:block}
@media (max-width:1380px){.trk{width:290px}.dlg{left:12px;right:12px}}

/* the run (J006): the YOUR QUEST panel, the hero line, the teleport screen, the run report */
.qn{font-size:18px}.qline{font-size:14px;color:var(--text)}
.herol{text-align:center;font-size:12px;color:var(--dim);margin-top:auto}
.tpscreen{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:hidden}
.tpbg{position:absolute;inset:0;background-size:400%;background-repeat:no-repeat;filter:brightness(.5) saturate(.9)}
.tpscreen::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,var(--bg) 120%)}
.tpbrand{position:absolute;left:40px;top:28px;z-index:2;font-size:18px}
.tpcard{position:absolute;z-index:2;left:50%;bottom:6%;transform:translateX(-50%);width:min(760px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 32px;display:flex;flex-direction:column;gap:12px}
.tpfrom{font-size:13px;color:var(--muted)}
.tprow{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.tprow h2{margin:0;font-family:var(--f-title);font-weight:700;font-size:32px;letter-spacing:3px;color:var(--warm)}
.tprow span{font-size:14px;color:var(--muted)}
.tpq{display:flex;align-items:center;gap:10px;font-size:15px}
.tpq i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);flex-shrink:0}
.tpbar{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.tpbar i{display:block;height:100%;width:0;background:var(--gold);animation:tpfill 1.6s ease-out forwards}
@keyframes tpfill{to{width:100%}}
.tpcard p{margin:0;font-size:13px;color:var(--muted)}
.repov{position:fixed;inset:0;background:#0D0F13d9;display:flex;align-items:center;justify-content:center;z-index:15;padding:20px}
.rep{width:820px;max-width:100%;background:var(--bg);border:1px solid var(--frame-line);border-radius:12px;padding:30px 32px;display:flex;flex-direction:column;gap:22px}
.rephead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.rephead h2{margin:0;font-family:var(--f-title);font-weight:700;font-size:26px;letter-spacing:3px;color:var(--warm)}
.rephead span{font-size:14px;color:var(--muted)}
.repgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.rc b{font-size:22px;color:var(--text)}.rc small{font-size:13px;color:var(--muted)}
.reprows{display:flex;flex-direction:column}
.reprows>div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.reprows span{color:var(--muted)}.reprows b{font-weight:500;text-align:right}.reprows b.g{color:var(--warm);font-weight:700}
.repbtn{display:flex;gap:12px}.repbtn .big{flex:1;width:auto}.repbtn .b2{flex:0 0 200px;height:56px;font-size:15px}
@media (max-width:640px){.repgrid{grid-template-columns:repeat(2,1fr)}.repbtn{flex-direction:column}.repbtn .b2{flex:none}}

/* J011: painted currency icons, next to a number or a label (the picture has its own dark ground, so it only gets a soft corner) */
.cur{width:18px;height:18px;border-radius:4px;vertical-align:-4px;margin-right:6px;display:inline-block}
.rc b{display:flex;align-items:center}.rc b .cur{width:24px;height:24px;margin-right:8px}

</style>

/* Heroes and saving. Nothing here draws anything.
   A hero: { id, name, race, level, gold, crowns, bag: [], gear: {}, created, story? }
   story: { introSeen, met, quests: { <quest id>: { state: offer | active | done, steps: { <step id>: true } } } }
   Saved in localStorage under DATA.game.storageKey as { heroes: [...], sel: id }. */
const IMG = "outgame/assets/";
/* J011: the small painted currency icon (gold, old-crowns, materials) next to a number or a label */
const CUR = n => `<img class="cur" src="${IMG}icons/${n}-64.png" alt="" width="18" height="18" draggable="false">`;
const GAME = DATA.game, RACES = DATA.races, STATIONS = DATA.stations;
const RACE = id => RACES.find(r => r.id === id) || RACES[0];

let S = { heroes: [], sel: null };
try { const x = JSON.parse(localStorage.getItem(GAME.storageKey)); if (x && Array.isArray(x.heroes)) S = Object.assign(S, x); } catch (e) { }
/* the worn gear a hero starts with (J006): the no-grade free gear of the team's run, ids from data/runs.json; shown to the player only as "worn gear" */
const wornGear = race => Object.assign({}, DATA.runs.wornGear[race] || DATA.runs.wornGear.default);
/* every field the run needs, with a default, because older saves do not have them */
function fixHero(h) {
 if (h.gold === undefined) { h.gold = h.adena || 0; delete h.adena; }
 if (h.crowns === undefined) h.crowns = 0;
 if (!h.bag) h.bag = []; if (!h.gear) h.gear = {};
 if (!Object.keys(h.gear).length && !h.bag.length) h.gear = wornGear(h.race);
 if (h.exp === undefined) h.exp = 0;
 if (!h.enc) h.enc = {}; if (!h.cons) h.cons = {}; if (!h.loot) h.loot = []; if (!h.cleared) h.cleared = {};
 if (h.runs === undefined) h.runs = 0;
 return h;
}
for (const h of S.heroes) fixHero(h);
const save = () => { try { localStorage.setItem(GAME.storageKey, JSON.stringify(S)); } catch (e) { } };
const hero = () => S.heroes.find(h => h.id === S.sel) || S.heroes[0] || null;

function checkName(n) {
 const t = n.trim();
 if (!t) return "Type a name.";
 if (!/^\p{L}+$/u.test(t)) return "Letters only, no spaces or numbers.";
 if (t.length < GAME.nameMin) return "At least " + GAME.nameMin + " letters.";
 if (t.length > GAME.nameMax) return "At most " + GAME.nameMax + " letters.";
 if (S.heroes.some(h => h.name.toLowerCase() === t.toLowerCase())) return "You already have a hero with this name.";
 return "";
}
function newHero(name, race, extra) {
 const id = "h" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
 return fixHero(Object.assign({ id, name, race, level: GAME.newHero.level, gold: GAME.newHero.gold, crowns: 0, bag: [], gear: {}, created: Date.now() }, extra || {}));
}
/* The first steps (J005). A hero made through "Create" gets a story: the intro is not seen yet, the Warden has a quest to give.
   Heroes without one (older saves, the demo heroes) have no intro and no Warden quest. */
function newStory() { return { introSeen: false, met: false, quests: { "welcome-outlaw": { state: "offer", steps: {} } } }; }
const storyOf = h => (h && h.story) || null;
function addHero(h) { S.heroes.push(h); S.sel = h.id; save(); }
function removeHero(id) {
 S.heroes = S.heroes.filter(x => x.id !== id);
 if (S.sel === id) S.sel = S.heroes[0] ? S.heroes[0].id : null;
 save();
}
function loadDemo() {
 if (S.heroes.length) return;
 DATA.demo.forEach(d => addHero(newHero(d.name, d.race, { level: d.level, gold: d.gold })));
 S.sel = S.heroes[0].id; save();
}
/* ?demo=new: one fresh Lv 1 hero, with the intro and the Warden quest still to come */
function loadNewDemo() { addHero(newHero("Mofo", "orc", { story: newStory() })); }
function resetAll() { S = { heroes: [], sel: null }; save(); }

/* the quest board of a hero with a story: Act I as in the approved drawing (J005); other heroes keep the old three rows */
function boardRows() {

}
function questRows() {

function chatAdd(from, text, mine) {

 d.innerHTML = `<span class="${mine ? "me" : "pn"}">${esc(from)}:</span> ${esc(text)}`;

}
function townHint(place) {

}

 const el = $("tpanel"); if (el) el.hidden = true;
 if (T.inst && !T.plan && !T.dlg) T.inst.setPaused(false);
}
function goMap() { U.view = null; U.screen = "map"; render(); }

/* ---------------------------------------------------------------- the first steps (J005): the Warden, the quest, the way marks */
const QD = DATA.quests.quests, WARDEN = DATA.story.warden, MPP = TOWN.metersPerPx;
/* how close you must be to talk to the Warden with E (about 6 m, a little extra for the size of the figures) */
const WARDEN_NEAR = 7;
const qdef = id => QD.find(q => q.id === id);
const qst = id => { const st = storyOf(hero()); return (st && st.quests[id]) || null; };
const planM = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]) * MPP;
/* the quest in the tracker: the one that is running */
function curQuest() {
 const st = storyOf(hero()); if (!st) return null;
 return QD.find(q => st.quests[q.id] && st.quests[q.id].state === "active") || null;
}
function questReady(q) { const qs = qst(q.id); return !!(q.steps && qs && q.steps.slice(0, -1).every(s => qs.steps[s.id])); }
function stepTarget(sp) {
 if (sp.kind === "place") { const p = placeOf(sp.place); return { x: p.x, y: p.y, name: sp.name }; }
 if (sp.kind === "quarter") { const z = TOWN.quarters.find(a => a.id === sp.quarter); return { x: z.x + z.w / 2, y: z.y + z.h / 2, name: sp.name }; }
 if (sp.kind === "point") return { x: sp.at[0], y: sp.at[1], name: sp.name };
 return { x: WARDEN.at[0], y: WARDEN.at[1], name: WARDEN.name };
}
function stepHit(sp, hp) {
 if (sp.kind === "place") { const p = placeOf(sp.place); return planM(hp, [p.x, p.y]) <= sp.radius; }
 if (sp.kind === "point") return planM(hp, sp.at) <= sp.radius;
 if (sp.kind === "quarter") { const z = TOWN.quarters.find(a => a.id === sp.quarter); return hp[0] >= z.x && hp[0] <= z.x + z.w && hp[1] >= z.y && hp[1] <= z.y + z.h; }
 return false;
}
function stepDone(sp) {
 const qs = qst(curQuest().id); qs.steps[sp.id] = true;
 if (sp.rename && T.inst) T.inst.addLabel("step-" + sp.id, esc(sp.rename), sp.at[0], sp.at[1], 6.5);
}
/* something happened (a panel opened): tick the steps that wait for it */
function stepEvent(kind, id) {
 const q = curQuest(); if (!q || !q.steps) return;
 let hit = false;
 q.steps.forEach(sp => { if (kind === "panel" && sp.kind === "place" && sp.panel && sp.place === id && !qst(q.id).steps[sp.id]) { stepDone(sp); hit = true; } });
 if (hit) { save(); toast("Step done"); refreshQuest(); }
}
function questTick() {
 if (!T.inst) return;
 const q = curQuest();
 if (q && q.steps && !T.dlg) {
  const hp = T.inst.heroPlan(), qs = qst(q.id);
  let hit = false;
  q.steps.forEach(sp => { if (!qs.steps[sp.id] && sp.kind !== "npc" && stepHit(sp, hp)) { stepDone(sp); hit = true; } });
  if (hit) { save(); toast("Step done"); refreshQuest(); }
 }
 refreshHint();
}
function refreshHint() {
 if (!T.inst) return;
 const w = !T.dlg && T.inst.npcDist(WARDEN.id) <= WARDEN_NEAR;
 townHint(w ? { name: WARDEN.name, sub: WARDEN.role } : T.near);
}
function renderTracker() {
 const el = $("ttrack"); if (!el) return;
 const q = curQuest();
 if (!q) { el.hidden = true; return; }
 const qs = qst(q.id), act = DATA.quests.acts.find(a => a.id === q.act), nx = q.next && qdef(q.next);
 const tick = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>`;
 const body = q.steps
  ? q.steps.map(sp => { const d = !!qs.steps[sp.id]; return `<div class="ts ${d ? "ok" : ""}"><span class="ck ${d ? "ok" : ""}">${d ? tick : ""}</span><span>${esc(sp.text)}</span></div>`; }).join("")
  : `<div class="ts"><span>${esc(q.goal)}</span></div><div class="ts ${qs.ready ? "" : "dim"}"><span>${esc(qs.ready ? q.ready : q.hint || "Coming next")}</span></div>`;
 el.innerHTML = `<div class="tk-act">ACT ${esc(q.act)} · ${esc(act.name.toUpperCase())}</div><div class="tk-title">${esc(q.title)}</div>${body}${nx ? `<div class="tk-next">Next: ${esc(nx.title)}${nx.run ? " · your first run" : ""}</div>` : ""}`;
 el.hidden = false;
}
function renderBoard() {
 const b = $("qboard"); if (b && storyOf(hero())) b.innerHTML = boardRows();
}
function updateMarks() {
 if (!T.inst) return;
 const q = curQuest(), list = [];
 if (q && q.steps) {
  const qs = qst(q.id);
  q.steps.forEach(sp => {
   if (qs.steps[sp.id] || sp.on === "accept") return;
   if (sp.after && !sp.after.every(id => qs.steps[id])) return;
   const t = stepTarget(sp); list.push({ id: sp.id, name: t.name, x: t.x, y: t.y });
  });
 }
 T.inst.setMarks(list);
}
function updateWardenMark() {
 if (!T.inst) return;
 const st = wardenState(); T.inst.npcMark(WARDEN.id, st === "offer" ? "give" : st === "ready" ? "ready" : st === "active" ? "wait" : null);
}
function updateMoney() {
 const h = hero();
 if ($("gold-amt")) $("gold-amt").textContent = fmt(h.gold);
 if ($("crowns-amt")) $("crowns-amt").textContent = fmt(h.crowns || 0);
 if ($("hide-gold")) $("hide-gold").textContent = fmt(h.gold);
}
function refreshQuest() { renderTracker(); renderBoard(); updateMarks(); updateWardenMark(); updateMoney(); }

/* the Warden: a dialog plate at the bottom of the 3D view */
/* the quest the Warden talks about: the welcome quest, then The First Road once it is running */
function wardenQuest() {
 const w = qst("welcome-outlaw"), f = qst("first-road");
 return qdef(w && w.state !== "done" || !f || f.state !== "active" ? "welcome-outlaw" : "first-road");
}
function wardenState() {
 const q = wardenQuest(), w = qst(q.id);
 if (!w) return "idle";
 if (w.state === "offer") return "offer";
 if (w.state === "active") return (q.steps ? questReady(q) : w.ready) ? "ready" : "active";
 return "idle";
}
function dialogHtml() {
 const q = wardenQuest(), L = WARDEN.lines, ws = wardenState(), act = DATA.quests.acts.find(a => a.id === q.act);
 let text, primary = null;
 if (T.king) text = L.king; else if (ws === "offer") text = L.offer; else if (ws === "active") text = q.steps ? L.reminder : L.roadReminder; else if (ws === "ready") text = q.steps ? L.turnin : L.roadTurnin; else text = T.thanked ? L.thanks : L.idle;
 if (ws === "offer") primary = "Accept: " + q.title; else if (ws === "ready") primary = "Hand in: " + q.title;
 const btns = (primary ? `<button class="dacc" data-dlg="primary">${esc(primary)} <kbd>E</kbd></button>` : `<button class="dacc" data-dlg="close">Close <kbd>Esc</kbd></button>`)
  + (T.king ? "" : `<button class="dalt" data-dlg="king">Who is the Sleepless King?</button>`)
  + (primary ? `<span class="drew">Reward <b>${q.reward.gold ? q.reward.gold + " Gold" : "[Gold]"}</b></span>` : "");
 return `<div class="dport" aria-hidden="true"><i class="dh"></i><i class="db"></i></div>
 <div class="dbody"><div class="dhead"><div><span class="dname">${esc(WARDEN.name.toUpperCase())}</span><span class="drole">${esc(WARDEN.role)}</span></div><span class="dact">Act ${esc(q.act)} · ${esc(act.name)}</span></div>
 <p>${esc(text)}</p><div class="dbtns">${btns}</div></div>`;
}
function openWarden() {
 if (!T.inst || T.dlg || T.plan) return;
 closePanel();
 const st = storyOf(hero()); if (st && !st.met) { st.met = true; save(); }
 T.dlg = true; T.king = false; T.thanked = false;
 const el = $("tdialog"); el.innerHTML = dialogHtml(); el.hidden = false;
 $("t3d").classList.add("talking");
 T.inst.setPaused(true); refreshHint();
}
function closeDialog() {
 if (!T.dlg) return;
 T.dlg = false;
 const el = $("tdialog"); if (el) el.hidden = true;
 const host = $("t3d"); if (host) host.classList.remove("talking");
 if (T.inst && !T.plan && !T.open) T.inst.setPaused(false);
}
function wardenClick() {
 if (T.dlg || T.plan) return;
 if (T.inst.npcDist(WARDEN.id) > 12) { toast("Come closer to talk to the Warden"); return; }
 openWarden();
}
function dlgPrimary() {
 const ws = wardenState(), q = wardenQuest(), w = qst(q.id), h = hero();
 if (ws === "offer") {
  w.state = "active"; if (q.steps) w.steps.talk = true; save(); closeDialog(); refreshQuest(); toast("Quest accepted: " + q.title);
 } else if (ws === "ready") {
  if (q.steps) w.steps.back = true; w.state = "done"; h.gold += q.reward.gold;
  const st = storyOf(h);
  if (!st.quests[q.next]) st.quests[q.next] = { state: "active", steps: {} };
  st.quests[q.next].state = "active";
  save(); T.thanked = true; T.king = false; refreshQuest();
  $("tdialog").innerHTML = dialogHtml(); toast("Quest done: " + q.title);
 } else closeDialog();
}
function dlgAction(a) {
 if (a === "primary") dlgPrimary();
 else if (a === "close") closeDialog();
 else if (a === "king") { T.king = true; $("tdialog").innerHTML = dialogHtml(); }
}

/* the plan (M): the approved drawing, with the places as buttons and a dot that follows the hero */
function renderPlan() {
 const box = $("tplan"), host = $("t3d");
 if (!box || !host) return;
 const pw = TOWN.plan.w, ph = TOWN.plan.h, W = host.clientWidth - 28, H = host.clientHeight - 28;
 const k = Math.min(W / pw, H / ph), w = pw * k, hh = ph * k;
 const px = v => (v * k).toFixed(1);
 const lay = window.Town3D.layout(TOWN), tp = TOWN.teleporter, S = TOWN.metersPerPx;
 let svg = `<rect class="p-bg" width="${pw}" height="${ph}"/><rect class="p-cliff" width="${pw}" height="${TOWN.cliffs.bottom}"/><rect class="p-river" x="30" y="${TOWN.river.top}" width="${TOWN.river.w}" height="${TOWN.wall.y - TOWN.river.top}"/>`;
 TOWN.caves.forEach(c => { svg += `<path class="p-cave" d="M${c.x - 26} ${c.y + 40}v-14a26 26 0 0 1 52 0v14z"/>`; });
 TOWN.streets.forEach(s => { svg += `<line class="p-street" x1="${s.from[0]}" y1="${s.from[1]}" x2="${s.to[0]}" y2="${s.to[1]}" stroke-width="${s.width}"/>`; });
 TOWN.quarters.forEach(q => {
  if (q.shape === "circle") svg += `<ellipse class="p-quarter" cx="${q.x + q.w / 2}" cy="${q.y + q.h / 2}" rx="${q.w / 2}" ry="${q.h / 2}"/>`;
  else if (q.shape === "rect") svg += `<rect class="p-quarter" x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" rx="36"/>`;
 });
 lay.houses.forEach(h => { const w = h.w / S, d = h.d / S; svg += `<rect class="p-house" x="${(h.x - w / 2).toFixed(0)}" y="${(h.y - d / 2).toFixed(0)}" width="${w.toFixed(0)}" height="${d.toFixed(0)}"/>`; });
 TOWN.buildings.forEach(b => {
  const k = b.full ? 1 : TOWN.scale.footprint, w = b.w * k, hh = b.h * k, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  if (b.shape === "round") svg += `<ellipse class="p-building" cx="${cx}" cy="${cy}" rx="${w / 2}" ry="${hh / 2}"/>`;
  else svg += `<rect class="p-building" x="${cx - w / 2}" y="${cy - hh / 2}" width="${w}" height="${hh}" rx="4" ${b.shape === "diamond" ? `transform="rotate(45 ${cx} ${cy})"` : ""}/>`;
 });
 lay.stalls.forEach(s => { const w = s.w / S, d = s.d / S; svg += `<rect class="p-stall" x="${(s.x - w / 2).toFixed(0)}" y="${(s.y - d / 2).toFixed(0)}" width="${w.toFixed(0)}" height="${d.toFixed(0)}" rx="3"/>`; });
 const tr = tp.radius / S;
 svg += `<circle class="p-tp-ring" cx="${tp.x}" cy="${tp.y}" r="${tr}"/><circle class="p-tp-core" cx="${tp.x}" cy="${tp.y}" r="${tr * 0.72}"/>`;
 svg += `<rect class="p-wall" x="80" y="${TOWN.wall.y - 7}" width="${pw - 86}" height="7" rx="3"/>`;
 let html = `<div class="planbox" style="width:${w.toFixed(0)}px;height:${hh.toFixed(0)}px"><svg viewBox="0 0 ${pw} ${ph}" width="${w.toFixed(0)}" height="${hh.toFixed(0)}">${svg}</svg>`;
 html += `<div id="pdots"></div>`;
 TOWN.quarters.forEach(q => { html += `<div class="pq" style="left:${px((q.planLabel || q.label)[0])}px;top:${px((q.planLabel || q.label)[1])}px">${esc(q.name.toUpperCase())}</div>`; });
 TOWN.places.forEach(p => { html += `<button class="ppin ${p.later ? "later" : ""}" style="left:${px(p.pin[0])}px;top:${px(p.pin[1])}px" data-planwalk="${p.id}"><b>${esc(p.name)}</b>${k >= 0.7 ? `<i>${esc(p.sub)}</i>` : ""}</button>`; });
 html += `<div class="pme" id="pme">You</div><div class="phint">Click a place to walk there · M or Esc closes</div></div>`;
 box.innerHTML = html;
 T.planK = k;
 updateDots();
}
function updateDots() {
 const box = $("pdots"), me = $("pme");
 if (!box || !T.inst) return;
 const k = T.planK;
 box.innerHTML = T.inst.crowdPlan().map(p => `<div class="pdot ${p.friend ? "fr" : ""}" style="left:${(p.x * k).toFixed(1)}px;top:${(p.y * k).toFixed(1)}px"><i></i>${esc(p.name)}</div>`).join("");
 const h = T.inst.heroPlan();
 me.style.left = (h[0] * k).toFixed(1) + "px"; me.style.top = (h[1] * k).toFixed(1) + "px";
}
function togglePlan(on) {
 if (!T.inst) return;
 T.plan = on === undefined ? !T.plan : on;
 const box = $("tplan");
 if (T.plan) { closePanel(); closeDialog(); renderPlan(); box.hidden = false; T.inst.setPaused(true); }
 else { box.hidden = true; if (!T.open && !T.dlg) T.inst.setPaused(false); }
}

function townMount() {
 const host = $("t3d");
 if (!host) return;
 const h = hero();
 try {
  T.inst = window.Town3D.start({
   container: host, town: TOWN, fake: FAKE, hero: { name: h.name, level: h.level },
   npcs: [{ id: WARDEN.id, name: WARDEN.name, x: WARDEN.at[0], y: WARDEN.at[1], color: "warden" }],
   onNear: p => { T.near = p; refreshHint(); }, onOpen: p => openPlace(p), onNpc: id => { if (id === WARDEN.id) wardenClick(); },
  });
 } catch (e) {
  console.error(e);
  host.insertAdjacentHTML("afterbegin", `<div class="t3derr">The 3D view could not start in this browser. Try a current Chrome, Edge or Safari.</div>`);
  return;
 }
 T.dlg = false; T.king = false; T.near = null;
 refreshQuest();
 const st = storyOf(h);
 if (st) QD.forEach(q => (q.steps || []).forEach(sp => { if (sp.rename && qst(q.id) && qst(q.id).steps[sp.id]) T.inst.addLabel("step-" + sp.id, esc(sp.rename), sp.at[0], sp.at[1], 6.5); }));
 T.timers.push(setInterval(questTick, 250));

/* pan and zoom: the image and everything on it is one layer moved with a transform; the signs keep a readable size on screen */
const MAPK = { max: 1.8 };
function mapMin() { const v = $("mapview"); return Math.max(v.clientWidth / REALM.plan.w, v.clientHeight / REALM.plan.h); }
function mapApply() {
 const w = $("mapworld"), v = $("mapview");
 if (!w || !v) return;
 const m = U.mapv, ww = REALM.plan.w * m.k, hh = REALM.plan.h * m.k;
 m.x = Math.min(0, Math.max(v.clientWidth - ww, m.x)); m.y = Math.min(0, Math.max(v.clientHeight - hh, m.y));
 w.style.transform = `translate(${m.x.toFixed(1)}px, ${m.y.toFixed(1)}px) scale(${m.k.toFixed(3)})`;
 w.style.setProperty("--ls", (Math.max(0.85, Math.min(1, m.k)) / m.k).toFixed(3));
}
function mapZoomAt(cx, cy, k2) {
 const m = U.mapv, k = Math.min(MAPK.max, Math.max(mapMin(), k2));
 m.x = cx - (cx - m.x) * (k / m.k); m.y = cy - (cy - m.y) * (k / m.k); m.k = k; mapApply();
}
function mapHome() {
 const v = $("mapview"), t = REALM.town, k = Math.min(MAPK.max, Math.max(mapMin(), 0.9));
 U.mapv = { k, x: v.clientWidth / 2 - t.x * k, y: v.clientHeight / 2 - t.y * k }; mapApply();
}
function mapMount() {
 const v = $("mapview"); if (!v) return;
 if (!U.mapv) mapHome(); else mapApply();
 let d = null;
 v.onpointerdown = e => { if (e.target.closest("button")) return; d = { x: e.clientX, y: e.clientY }; v.setPointerCapture(e.pointerId); v.classList.add("drag"); };
 v.onpointermove = e => { if (!d) return; U.mapv.x += e.clientX - d.x; U.mapv.y += e.clientY - d.y; d = { x: e.clientX, y: e.clientY }; mapApply(); };
 v.onpointerup = () => { d = null; v.classList.remove("drag"); };
 v.onwheel = e => { e.preventDefault(); const r = v.getBoundingClientRect(); mapZoomAt(e.clientX - r.left, e.clientY - r.top, U.mapv.k * (1 - e.deltaY * 0.0012)); };
}

/* The run (J006): START on our map, the team's run in their page, back in our town with our report.
   Everything the player sees is ours: our zone names, "Gold", "Old Crowns", "worn gear". The names inside the team's page are theirs (a local scaffold).
   The team's page gets the hero as `#hub=<base64 json>` and sends it back as `#ret=<base64 json>` to our page (see build_outgame.py, run_pages).
   Data: data/runs.json. */
const RUNS = DATA.runs;
const zoneRun = id => RUNS.zones[id] || null;
const zoneByArea = n => REALM.zones.find(z => RUNS.zones[z.id] && RUNS.zones[z.id].area === n) || null;
const expAt = lv => RUNS.exp[Math.min(80, Math.max(1, lv))] || 0;
const mmss = t => String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(Math.floor(t % 60)).padStart(2, "0");

/* open: the zone before it was beaten (its first boss); next: the first zone that is not open yet but whose zone before it is; the rest: locked */
function zoneState(z) {
 const r = zoneRun(z.id), h = hero();
 if (!r) return "locked";
 const open = id => { const o = zoneOf(id); return !o.opensAfter || !!(h && h.cleared && h.cleared[o.opensAfter]); };
 if (open(z.id)) return "open";
 const first = REALM.zones.find(x => zoneRun(x.id) && !open(x.id) && open(x.opensAfter));
 return first && first.id === z.id ? "next" : "locked";
}
const zoneLevel = z => { const r = zoneRun(z.id); return r ? r.band : z.level; };
const bossAt = (z, i) => (zoneRun(z.id).bosses[i]) + " at " + String(RUNS.bossAtMinutes[i]).padStart(2, "0") + ":00";

function runHub(h) {
 const m = RUNS.races[h.race] || RUNS.races.default;
 return { race: m.race, enc: h.enc, name: h.name, lv: h.level, exp: h.exp || (h.level > 1 ? expAt(h.level) : 0), adena: h.gold, aa: h.crowns || 0, buffs: [], cls: h.cls || m.cls, bag: h.bag, gear: h.gear, cons: h.cons };
}
const encHub = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decHub = s => JSON.parse(decodeURIComponent(escape(atob(s))));

/* START THE RUN: the teleport screen shows while the run page loads */
function startRun(zoneId) { return;
 const z = zoneOf(zoneId), h = hero();
 if (!h || !z || zoneState(z) !== "open") return;
 U.tp = { zone: zoneId };
 U.screen = "teleport"; render();
 const url = RUNS.pageDir + "area" + zoneRun(zoneId).area + ".html#hub=" + encHub(runHub(h));
 U.tpTimer = setTimeout(() => { location.href = url; }, 1700);
}
/* the quest that is running and has a run: its line on the map and the teleport screen */
function runQuest() { const q = curQuest(); return q && q.run ? q : null; }
function questLine(q) { return q.id === "first-road" ? "Survive 5 minutes in Ashen Fields." : q.goal; }

function vTeleport() {
 const z = zoneOf(U.tp.zone), r = zoneRun(z.id), q = runQuest(), lv = zoneLevel(z);
 const f = [(z.x - MAPIMG.left) / MAPIMG.w, z.y / MAPIMG.h].map(v => Math.max(0, Math.min(1, (4 * v - 0.5) / 3)));
 return `<div class="tpscreen"><div class="tpbg" style="background-image:url('${IMG}realm-map.png');background-position:${(f[0] * 100).toFixed(1)}% ${(f[1] * 100).toFixed(1)}%"></div>
 <div class="brand tpbrand">LEMUROTH</div>
 <div class="tpcard"><div class="tpfrom">Teleporting from the Outlaw town</div>
  <div class="tprow"><h2>${esc(z.name.toUpperCase())}</h2><span>Lv ${lv[0]}–${lv[1]} · ${r.minutes} min</span></div>
  ${q ? `<div class="tpq"><i></i>${esc(q.title)}: ${q.id === "first-road" ? "survive 5 minutes" : esc(q.goal)}</div>` : ""}
  <div class="tpbar"><i></i></div>
  <p>You move, your hero attacks on their own. Every minute, pick one card of three. The ${esc(r.bosses[0])} comes at ${String(RUNS.bossAtMinutes[0]).padStart(2, "0")}:00.</p></div></div>`;
}

/* ---- back from the run */
function readReturn() {
 const m = location.hash.match(/ret=([^&]+)/);
 if (!m) return false;
 let r = null; try { r = decHub(m[1]); } catch (e) { console.error(e); }
 history.replaceState(null, "", location.pathname + location.search);
 const h = hero();
 if (!r || !h || !r.run) return false;
 const before = { lv: h.level, gold: h.gold, crowns: h.crowns || 0, bag: h.bag.length };
 h.level = r.lv; h.exp = r.exp; h.gold = r.adena; if (r.aa != null) h.crowns = r.aa;
 if (r.bag) h.bag = r.bag; if (r.gear) h.gear = r.gear; if (r.cls) h.cls = r.cls; if (r.enc) h.enc = r.enc; if (r.cons) h.cons = r.cons;
 /* the loot is kept by their ids and names, and never shown with them: our names come with the Lemuroth codex */
 const loot = r.loot || [];
 for (const it of loot) { const same = it.count != null && h.loot.find(b => b.n === it.n && b.count != null); if (same) same.count += it.count; else h.loot.push(it); }
 const run = r.run, z = zoneByArea(run.area) || zoneOf("ashen-fields");
 h.runs = (h.runs || 0) + 1;
 if (run.bosses >= 1) h.cleared[z.id] = true;
 /* The First Road: the run lasted 5:00 or more */
 const fr = RUNS.firstRoad, qs = qst(fr.quest); let questTxt = "none running";
 if (qs && qs.state === "active" && z.id === fr.zone && run.t >= fr.seconds) qs.ready = true;
 if (qs && qs.state === "active") questTxt = qdef(fr.quest).title + (qs.ready ? " · done" : " · not yet");
 else if (qs && qs.state === "done") questTxt = qdef(fr.quest).title + " · done";
 const mats = loot.filter(i => i.kind === "mat" || i.kind === "part").reduce((n, i) => n + (i.count || 1), 0);
 const gear = loot.filter(i => i.kind === "gear").reduce((n, i) => n + (i.count || 1), 0) + Math.max(0, h.bag.length - before.bag);
 const nextTxt = qs && qs.ready ? "Back to the Teleporter Warden" : qs && qs.state === "active" ? "Run again: survive 5 minutes in Ashen Fields" : "Pick your next zone on the map";
 save();
 U.report = { zone: z.id, name: z.name, t: run.t, done: run.done, kills: run.kills, deaths: run.deaths, lv0: run.lv0, lv1: run.lv1, gold: run.adena, crowns: run.aa || 0, mats, gear, quest: questTxt, next: nextTxt };
 return true;
}

function vReport() {
 const r = U.report, cell = (v, l, ic) => `<div class="rc"><b>${ic ? CUR(ic) : ""}${v}</b><small>${l}</small></div>`;
 const sign = n => (n >= 0 ? "+" : "") + fmt(n);
 return `<div class="repov"><div class="rep" role="dialog" aria-label="Run report">
  <div class="rephead"><h2>RUN REPORT · ${esc(r.name.toUpperCase())}</h2><span>You ${r.done ? "finished" : "left"} the run at ${mmss(r.t)}</span></div>
  <div class="repgrid">${cell(mmss(r.t), "Time")}${cell(fmt(r.kills), "Kills")}${cell(`Lv ${r.lv0} → ${r.lv1}`, "Level")}${cell(fmt(r.deaths), "Deaths")}
   ${cell(sign(r.gold), "Gold", "gold")}${cell(sign(r.crowns), "Old Crowns", "old-crowns")}${cell(fmt(r.mats), "Materials", "materials")}${cell(fmt(r.gear), "Gear")}</div>
  <div class="reprows"><div><span>Quest</span><b class="g">${esc(r.quest)}</b></div><div><span>Next</span><b>${esc(r.next)}</b></div>
   <div><span>The loot</span><b>In your bag · with our names once the Lemuroth codex is made</b></div></div>
  <div class="repbtn"><button class="big" data-rep="close">CONTINUE</button><button class="b2" data-rep="again">Run again</button></div></div></div>`;

 if (U.screen === "teleport" && !U.tp) U.screen = "map";
 /* a new hero sees the intro once, before the town */
 if (U.screen === "town" && storyOf(hero()) && !storyOf(hero()).introSeen) { U.screen = "intro"; U.introI = 0; }
 const v = { signin: vSignin, heroes: vHeroes, create: vCreate, hideout: vHideout, town: vTown, map: vMap, intro: vIntro, teleport: vTeleport }[U.screen] || vSignin;
 $("app").innerHTML = v() + (U.report && U.screen === "town" ? vReport() : "");

 if (U.screen === "intro") U.introTimer = setTimeout(introNext, DATA.story.intro.autoSeconds * 1000);
}
function introNext() {
 if (U.screen !== "intro") return;
 if ((U.introI || 0) + 1 >= DATA.story.intro.frames.length) { introEnd(); return; }
 U.introI = (U.introI || 0) + 1; render();
}
function introEnd() {
 clearTimeout(U.introTimer);
 const st = storyOf(hero()); if (st) { st.introSeen = true; save(); }
 U.screen = "town"; render();
}
function make() {
 const err = checkName(U.name);
 U.nameErr = err;
 if (err) { $("nerr").textContent = err; return; }
 if (S.heroes.length >= GAME.maxHeroes) return;
 addHero(newHero(U.name.trim(), U.race, { story: newStory() }));
 U.name = ""; U.nameErr = ""; U.soon = null; U.screen = "town"; render();
}
function repAction(a) {
 const z = U.report && U.report.zone; U.report = null;
 const el = document.querySelector(".repov"); if (el) el.remove();
 if (a === "again" && z) startRun(z);
}
function toast(text) {
 let t = $("toast");
 if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
 t.textContent = text; t.classList.add("on");
 clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800);
}

document.addEventListener("click", e => {
 if (U.screen === "intro") { if (e.target.closest("[data-introskip]")) introEnd(); else introNext(); return; }
 const t = e.target.closest("button"); if (!t || t.disabled) return;
 const d = t.dataset;
 /* the town: changed in place, the 3D view keeps running */
 if (d.dlg) { dlgAction(d.dlg); return; }
 if (d.plan) { togglePlan(); return; }
 if (d.closepanel) { closePanel(); return; }
 if (d.later) { toast("Coming in a later wave"); return; }
 if (d.planwalk) { const p = placeOf(d.planwalk); togglePlan(false); if (T.inst) T.inst.walkTo(p.x, p.y); return; }
 if (d.gate) { goMap(); return; }
 /* the map */
 if (d.mapf) { U.mapf[d.mapf] = !U.mapf[d.mapf]; render(); return; }
 if (d.mz) {
  const v = $("mapview"), m = U.mapv;
  if (d.mz === "home") mapHome(); else mapZoomAt(v.clientWidth / 2, v.clientHeight / 2, m.k * (d.mz === "in" ? 1.25 : 0.8));
  return;
 }
 if (d.zone) { U.zone = d.zone; render(); return; }
 if (d.startrun) { startRun(d.startrun); return; }
 if (d.rep) { repAction(d.rep); return; }
 if (d.go) {
  U.screen = d.go; U.soon = null; if (d.go === "create") { U.name = ""; U.nameErr = ""; }
 }
 else if (d.sel) { S.sel = d.sel; save(); }
 else if (d.del) U.confirm = d.del;
 else if (d.no) U.confirm = null;
 else if (d.yes) { removeHero(d.yes); U.confirm = null; }
 else if (d.race) U.race = d.race;
 else if (d.make) { make(); return; }
 else if (d.soon) U.soon = d.soon;
 else if (d.start) U.run = true;
 else if (d.closerun) U.run = false;
 else return;
 render();
});

document.addEventListener("keydown", e => {
 if (U.report && U.screen === "town") { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); repAction("close"); } return; }
 if (U.screen === "intro") {
  if (e.key === "Escape") { e.preventDefault(); introEnd(); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); introNext(); }
  return;
 }
 if (U.screen !== "town" || !T.inst) return;
 if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
 if (e.ctrlKey || e.metaKey || e.altKey) return;
 const k = e.key.toLowerCase();
 if (k === "e") { if (T.dlg) dlgPrimary(); else if (T.open) closePanel(); else if (!T.plan) { if (T.inst.npcDist(WARDEN.id) <= WARDEN_NEAR) openWarden(); else openPlace(T.inst.nearest()); } }
 else if (k === "m") { if (!T.dlg) togglePlan(); }
 else if (e.key === "Escape") { if (T.dlg) closeDialog(); else if (T.open) closePanel(); else if (T.plan) togglePlan(false); }
});
window.addEventListener("resize", () => { if (U.screen === "intro") { const p = $("intro") && $("intro").querySelector(".ipic"); if (p) p.setAttribute("style", introPic(DATA.story.intro.frames[U.introI || 0]) + ";--auto:" + DATA.story.intro.autoSeconds + "s"); } if (T.plan) renderPlan(); if (U.screen === "map" && $("mapview")) mapApply(); });

(function init() {
 const q = new URLSearchParams(location.search);
 if (q.get("demo") === "reset") resetAll();
 if (q.get("demo") === "new") { resetAll(); loadNewDemo(); U.screen = "town"; }
 else if (q.get("demo")) loadDemo();
 const m = location.hash.match(/s=([a-z]+)/);
 if (m) U.screen = m[1];
 if (readReturn()) U.screen = "town";
 render();
})();

</script>
</body>
